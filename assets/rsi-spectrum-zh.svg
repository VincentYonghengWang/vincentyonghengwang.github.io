<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="720" viewBox="0 0 2400 720" role="img" aria-labelledby="title desc"><title id="title">任务空间连续谱</title><desc id="desc">Mapped-Space RSI, Partially Mapped RSI, Open-Ended RSI</desc><defs><linearGradient id="bg"><stop stop-color="#edf8ff"/><stop offset="1" stop-color="#f5edff"/></linearGradient><linearGradient id="arrow"><stop stop-color="#32a9f8"/><stop offset="1" stop-color="#a24af5"/></linearGradient></defs><rect width="2400" height="720" rx="20" fill="white"/><rect x="280" width="2120" height="720" rx="20" fill="url(#bg)"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#27354c"><text x="625" y="55" text-anchor="middle" font-size="33" font-weight="700" fill="#1260b6">已知空间 RSI</text><text x="1330" y="55" text-anchor="middle" font-size="33" font-weight="700" fill="#343275">部分已知空间 RSI</text><text x="2035" y="55" text-anchor="middle" font-size="33" font-weight="700" fill="#7524ce">开放式 RSI</text><path d="M280 105 L318 78 L318 94 H2360 V78 L2398 105 L2360 132 V116 H318 V132 Z" fill="url(#arrow)"/><path d="M20 150 H2380" stroke="#d9e0ef" stroke-width="1.5"/><text x="25" y="186" font-size="25" font-weight="600">任务空间</text><text x="310" y="184" font-size="25">特征明确且相对稳定</text><text x="1015" y="184" font-size="25">部分已知，仍有未知区域</text><text x="1720" y="184" font-size="25">大部分未知或持续演变</text><path d="M20 220 H2380" stroke="#d9e0ef" stroke-width="1.5"/><text x="25" y="256" font-size="25" font-weight="600">数据可用性</text><text x="310" y="254" font-size="25">丰富的历史数据</text><text x="1015" y="254" font-size="25">有一些数据，但不完整</text><text x="1720" y="254" font-size="25">数据稀少或需要新生成（需主动收集）</text><path d="M20 290 H2380" stroke="#d9e0ef" stroke-width="1.5"/><text x="25" y="326" font-size="25" font-weight="600">评估可靠性</text><text x="310" y="324" font-size="25">相对成熟且可靠</text><text x="1015" y="324" font-size="25">部分可靠，可能需要新的评估方法</text><text x="1720" y="324" font-size="25">通常不确定、昂贵或存在延迟</text><path d="M20 360 H2380" stroke="#d9e0ef" stroke-width="1.5"/><text x="25" y="396" font-size="25" font-weight="600">优化重点</text><text x="310" y="394" font-size="25">提高已知任务的表现</text><text x="1015" y="394" font-size="25">平衡优化与探索</text><text x="1720" y="394" font-size="25">发现新任务、新策略和新的评估方法</text><path d="M20 430 H2380" stroke="#d9e0ef" stroke-width="1.5"/><text x="25" y="466" font-size="25" font-weight="600">典型方法</text><text x="310" y="464" font-size="25">基准优化、失败分析、迭代改进</text><text x="1015" y="464" font-size="25">将基准优化与主动探索、数据获取相结合</text><text x="1720" y="464" font-size="25">实验设计、主动数据收集、评估设计、开放式探索</text><path d="M20 540 H2380" stroke="#d9e0ef" stroke-width="1.5"/><text x="25" y="576" font-size="25" font-weight="600">示例</text><text x="310" y="574" font-size="25">• 客户支持</text><text x="310" y="607" font-size="25">• 法律与合规</text><text x="310" y="640" font-size="25">• 人力资源与招聘</text><text x="310" y="673" font-size="25">• 业务运营</text><text x="1015" y="574" font-size="25">• 复杂的企业工作流</text><text x="1015" y="607" font-size="25">• 新兴应用领域</text><text x="1015" y="640" font-size="25">• 数据有限的新产品领域</text><text x="1720" y="574" font-size="25">• 科学发现</text><text x="1720" y="607" font-size="25">• 新训练算法</text><text x="1720" y="640" font-size="25">• 药物靶点发现</text><text x="1720" y="673" font-size="25">• 市场进入策略（GTM）</text></g></svg>