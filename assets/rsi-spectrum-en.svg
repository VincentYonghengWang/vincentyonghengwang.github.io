<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="720" viewBox="0 0 2400 720" role="img" aria-labelledby="title desc"><title id="title">Task-space spectrum</title><desc id="desc">Mapped-Space RSI, Partially Mapped RSI, Open-Ended RSI</desc><defs><linearGradient id="bg"><stop stop-color="#edf8ff"/><stop offset="1" stop-color="#f5edff"/></linearGradient><linearGradient id="arrow"><stop stop-color="#32a9f8"/><stop offset="1" stop-color="#a24af5"/></linearGradient></defs><rect width="2400" height="720" rx="20" fill="white"/><rect x="280" width="2120" height="720" rx="20" fill="url(#bg)"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#27354c"><text x="625" y="55" text-anchor="middle" font-size="33" font-weight="700" fill="#1260b6">Mapped-Space RSI</text><text x="1330" y="55" text-anchor="middle" font-size="33" font-weight="700" fill="#343275">Partially Mapped RSI</text><text x="2035" y="55" text-anchor="middle" font-size="33" font-weight="700" fill="#7524ce">Open-Ended RSI</text><path d="M280 105 L318 78 L318 94 H2360 V78 L2398 105 L2360 132 V116 H318 V132 Z" fill="url(#arrow)"/><path d="M20 150 H2380" stroke="#d9e0ef" stroke-width="1.5"/><text x="25" y="186" font-size="25" font-weight="600">Task Space</text><text x="310" y="184" font-size="25">Well-characterized and relatively stable</text><text x="1015" y="184" font-size="25">Partially known, with unknown areas</text><text x="1720" y="184" font-size="25">Largely unknown or continuously evolving</text><path d="M20 220 H2380" stroke="#d9e0ef" stroke-width="1.5"/><text x="25" y="256" font-size="25" font-weight="600">Data Availability</text><text x="310" y="254" font-size="25">Abundant historical data</text><text x="1015" y="254" font-size="25">Some data, but incomplete</text><text x="1720" y="254" font-size="25">Sparse or newly generated (requires active</text><text x="1720" y="287" font-size="25">collection)</text><path d="M20 290 H2380" stroke="#d9e0ef" stroke-width="1.5"/><text x="25" y="326" font-size="25" font-weight="600">Evaluation Reliability</text><text x="310" y="324" font-size="25">Relatively mature and reliable</text><text x="1015" y="324" font-size="25">Partially reliable, may require new evaluation</text><text x="1015" y="357" font-size="25">methods</text><text x="1720" y="324" font-size="25">Often uncertain, expensive, or delayed</text><path d="M20 360 H2380" stroke="#d9e0ef" stroke-width="1.5"/><text x="25" y="396" font-size="25" font-weight="600">Optimization Focus</text><text x="310" y="394" font-size="25">Improve performance on known tasks</text><text x="1015" y="394" font-size="25">Balance optimization and exploration</text><text x="1720" y="394" font-size="25">Discover new tasks, strategies, and evaluation</text><text x="1720" y="427" font-size="25">methods</text><path d="M20 430 H2380" stroke="#d9e0ef" stroke-width="1.5"/><text x="25" y="466" font-size="25" font-weight="600">Typical Methods</text><text x="310" y="464" font-size="25">Benchmark optimization, failure analysis,</text><text x="310" y="497" font-size="25">iterative improvement</text><text x="1015" y="464" font-size="25">Combine benchmark optimization with active</text><text x="1015" y="497" font-size="25">exploration and data acquisition</text><text x="1720" y="464" font-size="25">Experiment design, active data collection,</text><text x="1720" y="497" font-size="25">evaluation design, open-ended exploration</text><path d="M20 540 H2380" stroke="#d9e0ef" stroke-width="1.5"/><text x="25" y="576" font-size="25" font-weight="600">Examples</text><text x="310" y="574" font-size="25">• Customer support</text><text x="310" y="607" font-size="25">• Legal &amp; compliance</text><text x="310" y="640" font-size="25">• HR &amp; recruiting</text><text x="310" y="673" font-size="25">• Business operations</text><text x="1015" y="574" font-size="25">• Complex enterprise workflows</text><text x="1015" y="607" font-size="25">• Emerging application domains</text><text x="1015" y="640" font-size="25">• New product areas with limited data</text><text x="1720" y="574" font-size="25">• Scientific discovery</text><text x="1720" y="607" font-size="25">• Novel training algorithms</text><text x="1720" y="640" font-size="25">• Drug target discovery</text><text x="1720" y="673" font-size="25">• Go-to-market strategy</text></g></svg>